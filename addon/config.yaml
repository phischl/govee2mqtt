name: Govee to MQTT Bridge
image: ghcr.io/phischl/govee2mqtt-{arch}
version: "2026.08.27-79c90af5"
slug: govee2mqtt
description: Control Govee Devices
url: https://github.com/phischl/govee2mqtt
arch:
  - amd64
  - aarch64
init: false
startup: services
services:
  - mqtt:need

apparmor: true

webui: http://[HOST]:[PORT:8056]/assets/index.html
#ingress: true
#ingress_port: 8056

# Host network access is required for LAN discovery
host_network: true

map:
  - type: addon_config
    read_only: false
    path: /app/config

options:
  temperature_scale: "C"

schema:
  temperature_scale: "str?"
  govee_email: "str?"
  govee_password: "password?"
  govee_api_key: "password?"
  mqtt_host: "str?"
  mqtt_port: "int?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  debug_level: "str?"
  no_multicast: "bool?"
  broadcast_all: "bool?"
  global_broadcast: "bool?"
  scan: "str?"
  ble_topic_prefix: "str?"
  no_ble: "bool?"
  ble_exclude: "str?"
  ble_max_concurrent: "int?"
  transport_order: "str?"
  ble_address_map: "str?"
  poll_interval: "int(1,)?"
  poll_interval_lan: "int(1,)?"
  poll_interval_iot: "int(1,)?"
  poll_interval_platform: "int(1,)?"
  poll_interval_ble: "int(1,)?"
  poll_after_control: "int(1,)?"
  poll_order: "str?"
