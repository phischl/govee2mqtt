labels:
  org.opencontainers.image.title: "Home Assistant Add-on: Govee to MQTT Bridge"
  org.opencontainers.image.description: "Acts as a bridge between Govee devices and Home Assistant, via the Home Assistant MQTT Integration."
  org.opencontainers.image.source: "https://github.com/phischl/govee2mqtt"
  org.opencontainers.image.licenses: "MIT"

# We need to specify these explicitly otherwise :latest will be
# used by the builder, and that will fail the cosign chain of trust.
# This should probably be kept in sync with the settings in
# https://github.com/home-assistant/builder/blob/master/build.yaml
build_from:
  aarch64: "ghcr.io/home-assistant/aarch64-base-debian:bookworm"
  amd64: "ghcr.io/home-assistant/amd64-base-debian:bookworm"
# There is deliberately no cosign section here.
#
# Its presence is what makes the builder verify the Home Assistant base images,
# and the builder pins cosign v2.5.3 (via sigstore/cosign-installer@v4.0.0)
# while sigstore now requires v2.6.0 or later. The base images themselves are
# fine — verifying them with a current cosign succeeds:
#
#   docker run --rm ghcr.io/sigstore/cosign/cosign:latest verify \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp 'https://github.com/home-assistant/docker-base/.*' \
#     ghcr.io/home-assistant/amd64-base-debian:bookworm
#
# Removing --cosign from the builder args is not enough on its own; this block
# drives base image validation independently of that flag.
#
# Restore this once the add-on jobs move to the composable builder actions,
# which use a current cosign.
