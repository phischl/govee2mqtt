# Tooling config for the companion Home Assistant integration under
# custom_components/. This is not a distributable Python package; the [tool.*]
# tables exist so ruff and pytest can find their settings from the repo root.

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "UP", "RUF", "PL", "C4", "PIE", "RET", "BLE"]
ignore = [
    # Home Assistant fixes these signatures; unused parameters are not ours to drop.
    "ARG001",
    "ARG004",
]

[tool.ruff.lint.per-file-ignores]
"python-tests/*" = ["PLR2004"]  # literal expectations are the point of a test
# A wire-format parser is byte offsets and header lengths all the way down, and
# naming each one would obscure rather than explain; the layout is in the
# docstring and in docs/GOVEE-PROTOCOL.md.
"scripts/*" = ["PLR2004", "PLR0912"]

[tool.pytest.ini_options]
testpaths = ["python-tests"]
