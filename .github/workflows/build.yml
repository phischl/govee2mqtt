name: Container Build

on:
  # Lets a tag be (re)built by hand. Pushing a tag from a workflow using the
  # default GITHUB_TOKEN does not trigger another workflow, so this is how a
  # release gets built without setting up a personal access token.
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "20*"
    branches:
      - main
    paths:
      - "**/*.rs"
      - "addon/**"
      - "**/Cargo.*"
      - ".github/workflows/build.yml"
      - ".cargo/config.toml"
      - "scripts/build-cross.sh"
      - "scripts/build-docker.sh"
      - "Dockerfile"
      - ".dockerignore"

env:
  # Derived from the owner so that forks publish under their own namespace
  # without editing this file.
  IMAGE: ghcr.io/${{ github.repository_owner }}/govee2mqtt

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Docker meta
        if: ${{ github.event_name != 'pull_request' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            # Only used for the labels here -- the images themselves are pushed
            # by digest and tagged in the merge job. Without it a tag build
            # generates no metadata at all and annotates every run with
            # "No Docker tag has been generated".
            type=ref,event=tag,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=pr
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
      - name: "Install cross from Cargo"
        uses: baptiste0928/cargo-install@v3
        with:
          crate: "cross"
      # `govee --version` reports what build.rs stamped in, and with nothing
      # to go on build.rs derives it from the checked-out commit. On a release
      # that is the "Tag ..." commit the Release workflow just made, not the
      # code commit the tag is named after -- so the binary published as
      # 2026.08.26-127e1540 announced itself as 2026.08.26-512d01b0. Exactly
      # the mismatch that bit addon/config.yaml; see the addon job below.
      #
      # .tag is build.rs's own hook for this, inherited from upstream and never
      # written by anything. cross mounts the workspace, so the build container
      # sees it. Left absent on a branch, where deriving from the commit is
      # right. Not an env var: cross does not pass those into the container.
      - name: Stamp the release version into the binary
        if: ${{ github.ref_type == 'tag' }}
        run: echo "${{ github.ref_name }}" > .tag
      - name: Build executable
        run: ./scripts/build-cross.sh ${{ matrix.platform }}
      - name: Build No Push
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
      - name: Build and push by digest
        if: ${{ github.event_name != 'pull_request' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        if: ${{ github.event_name != 'pull_request' }}
        id: digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "DIGEST_NAME=$(echo ${{ matrix.platform }} | sed 's,/,-,g')" >> $GITHUB_OUTPUT
      - name: Upload digest
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ steps.digest.outputs.DIGEST_NAME }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=ref,event=tag,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=pr
      - name: Login to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            ${{ github.event_name == 'pull_request' && '--dry-run' || '' }} \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
  addon:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    needs:
      - merge
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The published version has to be the tag being built. Left unset, the
      # script derives it from the checked-out commit instead -- which on a
      # release is the "Tag ..." commit, not the code commit the tag is named
      # after. That publishes the add-on under a version addon/config.yaml
      # does not ask for, so Home Assistant looks for an image that does not
      # exist.
      - name: Apply tag to version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: ./scripts/apply-tag.sh
      # --cosign is deliberately absent. It makes the builder verify the Home
      # Assistant base images, and the cosign bundled with this builder release
      # (v2.5.3) can no longer do so: sigstore now requires v2.6.0 or later.
      # Our own image verifies fine, so only base image verification is lost.
      #
      # Bumping the builder is not the fix: the monolithic action was deprecated
      # in 2026.03.0 and removed in 2026.06.0. The real fix is migrating to the
      # composable actions (home-assistant/builder/actions/build-image and
      # publish-multi-arch-manifest), which is its own piece of work.
      - name: Build and Publish Home Assistant Add On
        uses: home-assistant/builder@2026.02.1
        with:
          args: |
            --amd64 \
            --aarch64 \
            --target /data/addon

  test-addon:
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-latest
    needs:
      # Note! Despite the dependency edge here to the build steps above,
      # this test-addon build flow will build the addon from the latest
      # images that were published to ghcr.io, which is NOT the ones we
      # build here because we don't push those when we trigger the conditions
      # for this to build.
      # Thats "OK" because the addon build doesn't actually run anything
      # from that container image.
      # The test-addon flow is validating that the addon build configuration
      # looks plausible, so the prior image should be sufficient for that.
      # If you are reading this and know how to get the bits above funnelled
      # into the hass build below, and it isn't eye-bleedingly-gnarly, then
      # please submit a PR!
      - build
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@v6
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # addon/Dockerfile pins the binary to BUILD_VERSION, which the builder
      # reads from addon/config.yaml. On a tag the merge job has just published
      # that version; on a branch it names the last release, and right after
      # the Release workflow commits a bump those images may still be building.
      # This job only checks that the add-on build configuration is plausible,
      # so which binary goes in does not matter -- ask for :latest and it
      # cannot race.
      - name: Build against the latest published image
        run: |
          sed -i 's/^version:.*/version: "latest"/' addon/config.yaml
      # See the note on the addon job above for why --cosign is absent.
      - name: Test Build Home Assistant Add On
        uses: home-assistant/builder@2026.02.1
        with:
          args: |
            --test \
            --amd64 \
            --aarch64 \
            --target /data/addon
