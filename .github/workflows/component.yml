name: Home Assistant Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "custom_components/**"
      - "python-tests/**"
      - "pyproject.toml"
      - "hacs.json"
      - ".github/workflows/component.yml"

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install tooling
        run: pip install ruff pytest
      - name: Ruff check
        run: ruff check custom_components python-tests
      - name: Ruff format
        run: ruff format --check custom_components python-tests
      - name: Tests
        run: python -m pytest -q

  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration
          # This repository is primarily a Home Assistant add-on repository, so
          # it carries no brand images and its README documents the add-on
          # rather than the integration.
          ignore: brands
