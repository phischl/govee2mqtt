name: Home Assistant Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "custom_components/**"
      - "python-tests/**"
      - "pyproject.toml"
      - "hacs.json"
      - ".github/workflows/component.yml"

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install tooling
        run: pip install ruff pytest
      - name: Ruff check
        run: ruff check custom_components python-tests scripts
      - name: Ruff format
        run: ruff format --check custom_components python-tests scripts
      - name: Tests
        run: python -m pytest -q

  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration
          # These are requirements for inclusion in the default HACS store,
          # which this repository is not applying for. Installed as a custom
          # repository, HACS does not check them.
          #
          #   brands - no icon has been contributed to home-assistant/brands
          #   topics - repository topics are a store listing concern
          #   issues - the fork tracks its work here, not through issues
          ignore: brands topics issues
